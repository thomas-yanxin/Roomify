<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roomify · 解析审查台</title>
<style>
/* ── Instrument: graphite chrome, the drawing is the only lit surface ────── */
:root{
  --ink:#0a0d10; --panel:#11161b; --panel-2:#161d23; --rule:#212b33; --rule-2:#2f3d47;
  --fg:#dde6ec; --fg-dim:#7d8d99; --fg-faint:#4d5a65;
  --signal:#6fe3bd; --warn:#f0b429; --bad:#f0645f; --good:#5fd08a; --vlm:#8fb8ff;
  --mono:"IBM Plex Mono","JetBrains Mono","Iosevka",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --han:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --rail-l:4.25rem; --rail-r:23rem; --top:2.75rem;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--fg);
  font:12px/1.5 var(--mono);letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
.han{font-family:var(--han)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--signal);outline-offset:2px}

/* ── shell ───────────────────────────────────────────────────────────────── */
.shell{display:grid;height:100%;
  grid-template-columns:var(--rail-l) 1fr var(--rail-r);
  grid-template-rows:var(--top) 1fr;
  grid-template-areas:"brand top top" "plans stage data";}
@media (max-width:1100px){
  .shell{grid-template-columns:var(--rail-l) 1fr;grid-template-areas:"brand top" "plans stage";}
  .data{display:none}
}

/* ── brand + top rail ────────────────────────────────────────────────────── */
.brand{grid-area:brand;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  display:grid;place-items:center;background:var(--panel)}
.brand b{font-size:15px;letter-spacing:-.04em;color:var(--signal)}
.top{grid-area:top;border-bottom:1px solid var(--rule);background:var(--panel);
  display:flex;align-items:center;gap:1.25rem;padding:0 1rem;overflow:hidden}
.title{display:flex;align-items:baseline;gap:.6rem;min-width:0}
.title h1{margin:0;font-size:13px;font-weight:600;white-space:nowrap}
.title .sub{color:var(--fg-faint);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layers{display:flex;gap:1px;margin-left:auto;background:var(--rule);border:1px solid var(--rule);flex:none}
.layers button{padding:.3rem .6rem;background:var(--panel-2);color:var(--fg-faint);
  font-size:10px;letter-spacing:.12em;transition:color .12s,background .12s}
.layers button[aria-pressed="true"]{background:#1d262e;color:var(--fg)}
.layers button::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  margin-right:.45rem;vertical-align:middle;border:1px solid currentColor}
.layers button[aria-pressed="true"]::before{background:currentColor}
.layers button[data-layer="rooms"][aria-pressed="true"]{color:var(--good)}
.layers button[data-layer="walls"][aria-pressed="true"]{color:var(--signal)}
.layers button[data-layer="openings"][aria-pressed="true"]{color:var(--warn)}
.layers button[data-layer="elements"][aria-pressed="true"]{color:var(--vlm)}
.zoomro{display:flex;align-items:center;gap:.5rem;color:var(--fg-faint);font-size:11px;flex:none}

/* ── plan rail: numbers + status LEDs ────────────────────────────────────── */
.plans{grid-area:plans;background:var(--panel);border-right:1px solid var(--rule);
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.plans ol{list-style:none;margin:0;padding:0}
.plans button{width:100%;display:grid;gap:.3rem;justify-items:center;padding:.6rem .25rem;
  border-bottom:1px solid var(--rule);border-left:2px solid transparent;
  color:var(--fg-faint);transition:color .12s,background .12s,border-color .12s}
.plans button:hover{background:var(--panel-2);color:var(--fg-dim)}
.plans button[aria-current="true"]{color:var(--fg);background:#1a232a;border-left-color:var(--signal)}
.plans .n{font-size:13px;font-variant-numeric:tabular-nums}
.led{display:flex;gap:2px}
.led i{width:4px;height:4px;border-radius:50%;background:var(--fg-faint)}
.led i.ok{background:var(--good)} .led i.warn{background:var(--warn)} .led i.bad{background:var(--bad)}

/* ── stage: the plan is the only light thing on the page ─────────────────── */
.stage{grid-area:stage;position:relative;overflow:hidden;background:
  radial-gradient(120% 90% at 50% 0%,#131a20 0%,var(--ink) 70%);
  cursor:grab;touch-action:none}
.stage.dragging{cursor:grabbing}
.stage::after{ /* grain: keeps the flat dark from reading as a dead div */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.28;
  background-image:radial-gradient(currentColor .5px,transparent .5px);
  background-size:3px 3px;color:#26313a}
.viewport{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.viewport img{display:block;max-width:none;box-shadow:0 0 0 1px #38464f,0 24px 60px -20px #000}
.viewport svg{position:absolute;top:0;left:0;overflow:visible}
.hint{position:absolute;left:1rem;bottom:.9rem;color:var(--fg-faint);font-size:10px;
  letter-spacing:.1em;pointer-events:none}

/* overlay marks */
.room{fill:transparent;stroke:var(--good);stroke-width:1.5;vector-effect:non-scaling-stroke;
  transition:fill .12s}
.room.flag{stroke:var(--bad)}
.room.vlm{stroke:var(--vlm);stroke-dasharray:5 3}
.room.hot{fill:color-mix(in srgb,var(--signal) 18%,transparent);stroke:var(--signal);stroke-width:2.5}
.wall{stroke:var(--signal);stroke-opacity:.85;stroke-linecap:round;vector-effect:non-scaling-stroke}
.op{fill:none;stroke:var(--warn);stroke-width:1.5;vector-effect:non-scaling-stroke}
.op.unres{stroke:var(--fg-faint);stroke-dasharray:3 3}
.swing{stroke:var(--warn);stroke-opacity:.6;fill:none;vector-effect:non-scaling-stroke}
.el{fill:none;stroke:var(--vlm);stroke-width:1.5;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.tag{fill:var(--fg);font:600 10px var(--mono);paint-order:stroke;stroke:#0009;stroke-width:3px}

/* ── data rail ───────────────────────────────────────────────────────────── */
.data{grid-area:data;background:var(--panel);border-left:1px solid var(--rule);
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.sect{border-bottom:1px solid var(--rule)}
.sect > h2{margin:0;padding:.7rem 1rem .5rem;font-size:10px;font-weight:600;
  letter-spacing:.18em;color:var(--fg-faint);
  display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.sect > h2 em{font-style:normal;color:var(--fg-dim);letter-spacing:.04em;text-align:right}
.kv{padding:0 1rem .8rem;display:grid;grid-template-columns:auto 1fr;gap:.2rem .9rem}
.kv dt{color:var(--fg-faint)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

/* the anchor: signed deviation bars growing from a centre tick */
.rows{padding:0 0 .6rem}
.row{display:grid;grid-template-columns:1fr 4.8rem 5.5rem;align-items:center;gap:.5rem;
  width:100%;padding:.3rem 1rem;text-align:left;border-left:2px solid transparent}
.row:hover,.row.hot{background:var(--panel-2);border-left-color:var(--signal)}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--han)}
.row .nm.code{font-family:var(--mono);color:var(--fg-faint)}
.row .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg-dim)}
.row .num u{text-decoration:none;color:var(--fg-faint)}
.bar{position:relative;height:11px;background:
  linear-gradient(90deg,transparent calc(50% - .5px),var(--rule-2) calc(50% - .5px),
                  var(--rule-2) calc(50% + .5px),transparent calc(50% + .5px))}
.bar span{position:absolute;top:2px;height:7px;background:var(--good)}
.bar span.over{background:var(--bad)}
.bar.none::after{content:"—";position:absolute;inset:0;text-align:center;color:var(--fg-faint);
  font-size:10px;line-height:11px}
.msg{padding:.35rem 1rem;display:grid;grid-template-columns:auto 1fr;gap:.6rem;
  border-left:2px solid var(--rule-2);color:var(--fg-dim)}
.msg.w{border-left-color:var(--warn)}
.msg code{color:var(--fg-faint);font-size:10px;white-space:nowrap}

/* ── loader / fallback ───────────────────────────────────────────────────── */
.gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);z-index:9;padding:2rem}
.gate .card{max-width:44rem;border:1px solid var(--rule);background:var(--panel);padding:2rem}
.gate h2{margin:0 0 .4rem;font-size:16px}
.gate p{margin:.5rem 0;color:var(--fg-dim);line-height:1.7;font-family:var(--han)}
.gate pre{margin:1rem 0;padding:.8rem 1rem;background:var(--ink);border:1px solid var(--rule);
  color:var(--signal);overflow-x:auto;font-family:var(--mono)}
.gate label{display:inline-block;margin-top:.5rem;padding:.55rem 1rem;border:1px solid var(--rule-2);
  color:var(--fg);cursor:pointer;transition:border-color .12s,color .12s;font-family:var(--han)}
.gate label:hover{border-color:var(--signal);color:var(--signal)}
.gate input{position:absolute;width:1px;height:1px;opacity:0}
.gate[hidden]{display:none}
</style>
</head>
<body>

<div class="shell">
  <div class="brand"><b>R/</b></div>

  <header class="top">
    <div class="title">
      <h1 id="planName">—</h1>
      <span class="sub" id="planSub"></span>
    </div>
    <div class="layers" id="layers" role="group" aria-label="图层">
      <button type="button" data-layer="rooms"    aria-pressed="true" class="han">房间</button>
      <button type="button" data-layer="walls"    aria-pressed="true" class="han">墙</button>
      <button type="button" data-layer="openings" aria-pressed="true" class="han">门窗</button>
      <button type="button" data-layer="elements" aria-pressed="true" class="han">构件</button>
      <button type="button" data-layer="labels"   aria-pressed="true" class="han">标注</button>
    </div>
    <div class="zoomro"><span id="zoomRo">100%</span>
      <button type="button" id="fit" class="han" title="适应窗口 (F)">适应</button></div>
  </header>

  <nav class="plans" aria-label="案例"><ol id="planList"></ol></nav>

  <main class="stage" id="stage">
    <div class="viewport" id="viewport">
      <img id="planImg" alt="">
      <svg id="ov" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <p class="hint han">滚轮缩放 · 拖拽平移 · F 适应 · ←/→ 切换案例</p>
  </main>

  <aside class="data" id="data"></aside>
</div>

<div class="gate" id="gate" hidden>
  <div class="card">
    <h2 class="han">需要通过本地服务打开</h2>
    <p>浏览器禁止 <code>file://</code> 页面读取同目录文件，所以这个审查台要从一个本地服务加载。
       在 <code>examples/</code> 目录下执行：</p>
    <pre>python3 -m http.server 8000</pre>
    <p>然后打开 <code>http://localhost:8000/gallery.html</code>。
       跑完新的 case 只要刷新页面，无需重新生成 HTML。</p>
    <p>不想起服务的话，直接把 <code>examples/</code> 整个目录交给下面的选择器：</p>
    <label>选择 examples 目录<input type="file" id="pick" webkitdirectory directory multiple></label>
  </div>
</div>

<script>
(() => {
"use strict";

/* Every string below — room names, warning text, element types — is
   transcribed by a VLM out of a user-supplied image, so it is untrusted.
   The whole UI is built with DOM nodes and textContent; there is no
   innerHTML anywhere and no HTML parsing of plan data. */
const $ = (s, r = document) => r.querySelector(s);

function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in attrs || {}) {
    if (k === "class") n.className = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k === "style") n.style.cssText = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  }
  for (const c of kids) if (c) n.append(c);
  return n;
}

function svgEl(tag, attrs) {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

const num = (v, d = 1) => (v === null || v === undefined) ? "—" : (+v).toFixed(d);

const state = {
  plans: [],          // [{key, doc, imgUrl}]
  i: 0,
  layers: {rooms: true, walls: true, openings: true, elements: true, labels: true},
  view: {x: 0, y: 0, k: 1},
  hot: null,          // highlighted room id, shared by overlay and data rail
};

/* ── discovery ───────────────────────────────────────────────────────────────
   Probe for floorplan-N.json rather than keep a manifest, so a case written
   into examples/ by a pipeline run shows up on the next refresh with nothing
   to regenerate. */
const MAX_PROBE = 60;

function imageFor(doc, key) {
  const src = String(doc.source_file || "").split(/[\\/]/).pop();
  return src || (key + ".png");
}

async function loadFromServer() {
  const tries = [];
  for (let n = 1; n <= MAX_PROBE; n++) {
    const key = "floorplan-" + n;
    tries.push(
      fetch(key + ".json", {cache: "no-store"})
        .then(r => r.ok ? r.json() : null)
        .then(doc => doc && {key: key, doc: doc, imgUrl: imageFor(doc, key)})
        .catch(() => null));
  }
  return (await Promise.all(tries)).filter(Boolean);
}

/* Directory-picker fallback: reads straight off the disk, no server needed. */
async function loadFromFiles(fileList) {
  const files = new Map();
  for (const f of fileList) files.set(f.name, f);
  const out = [];
  for (const [name, file] of files) {
    const m = name.match(/^(floorplan-\d+)\.json$/);
    if (!m) continue;
    const key = m[1];
    const doc = JSON.parse(await file.text());
    const img = files.get(imageFor(doc, key));
    out.push({key: key, doc: doc, imgUrl: img ? URL.createObjectURL(img) : ""});
  }
  return out;
}

const planNo = p => Number((p.key.match(/\d+/) || [0])[0]);

/* ── plan rail ───────────────────────────────────────────────────────────── */
function renderPlanList() {
  $("#planList").replaceChildren(...state.plans.map((p, idx) => {
    const flags = p.doc.rooms.filter(r => r.area_deviation_flag).length;
    const warns = p.doc.warnings.length;
    const led = h("span", {class: "led"},
      h("i", {class: flags === 0 ? "ok" : flags <= 2 ? "warn" : "bad"}),
      h("i", {class: warns === 0 ? "ok" : warns <= 6 ? "warn" : "bad"}));
    const b = h("button", {
      type: "button",
      "aria-current": idx === state.i ? "true" : "false",
      title: p.key + " · " + p.doc.rooms.length + " 房间 · " +
             flags + " 面积异常 · " + warns + " 警告",
      onclick: () => show(idx),
    }, h("span", {class: "n", text: String(planNo(p)).padStart(2, "0")}), led);
    return h("li", null, b);
  }));
}

/* ── overlay ─────────────────────────────────────────────────────────────── */
function renderOverlay() {
  const doc = state.plans[state.i].doc;
  const ov = $("#ov");
  ov.setAttribute("viewBox", "0 0 " + doc.image_width_px + " " + doc.image_height_px);
  ov.setAttribute("width", doc.image_width_px);
  ov.setAttribute("height", doc.image_height_px);
  const g = [];

  if (state.layers.walls) for (const w of doc.walls) {
    g.push(svgEl("line", {class: "wall", x1: w.start_px.x, y1: w.start_px.y,
      x2: w.end_px.x, y2: w.end_px.y,
      "stroke-width": Math.max(1.5, w.thickness_px * 0.55)}));
  }

  if (state.layers.rooms) for (const r of doc.rooms) {
    const cls = ["room", r.area_deviation_flag ? "flag" : "", r.source === "vlm" ? "vlm" : "",
      state.hot === r.id ? "hot" : ""].filter(Boolean).join(" ");
    const poly = svgEl("polygon", {class: cls, "data-room": r.id,
      points: r.polygon_px.map(p => p.x + "," + p.y).join(" ")});
    poly.addEventListener("pointerenter", () => setHot(r.id));
    poly.addEventListener("pointerleave", () => setHot(null));
    g.push(poly);
  }

  if (state.layers.openings) for (const o of doc.openings) {
    const b = o.bbox_px;
    g.push(svgEl("rect", {
      class: "op" + (o.element_type === "unknown_symbol" ? " unres" : ""),
      x: b.x0 - 1, y: b.y0 - 1, width: (b.x1 - b.x0) + 2, height: (b.y1 - b.y0) + 2}));
    if (o.hinge_px && o.width_px) {     // measured swing: hinge dot + leaf radius
      g.push(svgEl("circle", {cx: o.hinge_px.x, cy: o.hinge_px.y, r: 2.5,
        fill: "var(--warn)", stroke: "none"}));
      g.push(svgEl("circle", {class: "swing", cx: o.hinge_px.x, cy: o.hinge_px.y,
        r: o.width_px, "stroke-dasharray": "3 4"}));
    }
  }

  if (state.layers.elements) for (const e of doc.elements) {
    const b = e.bbox_px;
    g.push(svgEl("rect", {class: "el", x: b.x0, y: b.y0,
      width: b.x1 - b.x0, height: b.y1 - b.y0}));
  }

  if (state.layers.labels) for (const r of doc.rooms) {
    const c = centroid(r.polygon_px);
    const t = svgEl("text", {class: "tag", x: c.x, y: c.y, "text-anchor": "middle"});
    t.textContent = (r.name || r.room_type) + " " + num(r.area_sqm, 1);
    g.push(t);
  }

  ov.replaceChildren(...g);
}

function centroid(pts) {
  let a = 0, x = 0, y = 0;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length];
    const f = p.x * q.y - q.x * p.y;
    a += f; x += (p.x + q.x) * f; y += (p.y + q.y) * f;
  }
  if (!a) return pts[0] || {x: 0, y: 0};
  return {x: x / (3 * a), y: y / (3 * a)};
}

/* ── data rail ───────────────────────────────────────────────────────────── */
function section(title, count, body) {
  return h("section", {class: "sect"},
    h("h2", null, h("span", {text: title}), h("em", {text: count})), body);
}

function kv(pairs) {
  const dl = h("dl", {class: "kv"});
  for (const [k, v] of pairs) dl.append(h("dt", {text: k}), h("dd", {text: v}));
  return dl;
}

function deviationBar(pct) {
  const bar = h("span", {
    class: "bar" + (pct === null ? " none" : ""),
    title: pct === null ? "无印刷面积" : pct.toFixed(1) + "%",
  });
  if (pct !== null) {
    const w = Math.min(50, Math.abs(pct) / 40 * 50);       // ±40% fills the rail
    bar.append(h("span", {
      class: Math.abs(pct) > 10 ? "over" : "",
      style: (pct < 0 ? "right:50%;width:" : "left:50%;width:") + w + "%",
    }));
  }
  return bar;
}

function renderData() {
  const doc = state.plans[state.i].doc;
  const s = doc.scale;
  const dev = doc.rooms.map(r => Math.abs(r.area_deviation || 0))
                       .filter(v => v > 0).sort((a, b) => a - b);
  const median = dev.length ? dev[dev.length >> 1] : null;

  const scale = kv([
    ["px/mm x · y", s ? num(s.px_per_mm_x, 4) + " · " + num(s.px_per_mm_y, 4) : "—"],
    ["anisotropy", s ? (s.anisotropy * 100).toFixed(1) + "%" : "—"],
    ["confidence", s ? s.confidence : "—"],
    ["median |dev|", median === null ? "—" : (median * 100).toFixed(1) + "%"],
  ]);

  const rooms = h("div", {class: "rows"});
  for (const r of doc.rooms) {
    const d = r.area_deviation;
    const pct = (d === null || d === undefined) ? null : d * 100;
    const name = r.name
      ? h("span", {class: "nm", text: r.name})
      : h("span", {class: "nm code", text: r.room_type});
    const area = h("span", {class: "num", text: num(r.area_sqm, 1)});
    area.append(h("u", {text: "/" + (r.printed_area_sqm == null ? "—" : num(r.printed_area_sqm, 1))}));
    const row = h("button", {
      type: "button",
      class: "row" + (state.hot === r.id ? " hot" : ""),
      "data-room": r.id,
      onpointerenter: () => setHot(r.id),
      onpointerleave: () => setHot(null),
      onfocus: () => setHot(r.id),
    }, name, area, deviationBar(pct));
    rooms.append(row);
  }

  const roomName = {};
  for (const r of doc.rooms) roomName[r.id] = r.name || r.room_type;
  const ops = h("div", {class: "rows"});
  for (const o of doc.openings) {
    ops.append(h("div", {class: "row"},
      h("span", {class: "nm code", text: o.element_type}),
      h("span", {class: "num", text: o.width_mm == null ? "—" : String(Math.round(o.width_mm))}),
      h("span", {class: "num han", style: "text-align:left",
        text: o.connects.map(c => roomName[c] || c).join(" ↔ ")})));
  }

  const warn = h("div");
  for (const w of doc.warnings) {
    warn.append(h("div", {class: "msg w"},
      h("code", {text: w.code}), h("span", {class: "han", text: w.message})));
  }
  const unres = h("div");
  for (const u of doc.unresolved) {
    unres.append(h("div", {class: "msg"},
      h("code", {text: u.path}), h("span", {class: "han", text: u.reason})));
  }

  $("#data").replaceChildren(
    section("SCALE", s ? s.method : "none", scale),
    section("ROOMS", doc.rooms.length + " · 实测/印刷 ㎡ · 偏差", rooms),
    section("OPENINGS", doc.openings.length + " · mm", ops),
    section("WARNINGS", String(doc.warnings.length), warn),
    section("UNRESOLVED", String(doc.unresolved.length), unres));
}

function setHot(id) {
  if (state.hot === id) return;
  state.hot = id;
  for (const n of document.querySelectorAll("[data-room]")) {
    n.classList.toggle("hot", n.getAttribute("data-room") === id);
  }
}

/* ── viewport ────────────────────────────────────────────────────────────── */
function applyView() {
  const v = state.view;
  $("#viewport").style.transform =
    "translate(" + v.x + "px, " + v.y + "px) scale(" + v.k + ")";
  $("#zoomRo").textContent = Math.round(v.k * 100) + "%";
}

function fit() {
  const doc = state.plans[state.i].doc;
  const st = $("#stage").getBoundingClientRect();
  const pad = 28;
  const k = Math.min((st.width - pad * 2) / doc.image_width_px,
                     (st.height - pad * 2) / doc.image_height_px);
  state.view = {k: k,
    x: (st.width - doc.image_width_px * k) / 2,
    y: (st.height - doc.image_height_px * k) / 2};
  applyView();
}

function bindStage() {
  const stage = $("#stage");
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const k = Math.min(12, Math.max(0.05, state.view.k * Math.exp(-e.deltaY * 0.0016)));
    const s = k / state.view.k;
    state.view.x = mx - (mx - state.view.x) * s;
    state.view.y = my - (my - state.view.y) * s;
    state.view.k = k;
    applyView();
  }, {passive: false});

  let id = null, px = 0, py = 0;
  stage.addEventListener("pointerdown", e => {
    id = e.pointerId; px = e.clientX; py = e.clientY;
    stage.setPointerCapture(id); stage.classList.add("dragging");
  });
  stage.addEventListener("pointermove", e => {
    if (e.pointerId !== id) return;
    state.view.x += e.clientX - px; state.view.y += e.clientY - py;
    px = e.clientX; py = e.clientY; applyView();
  });
  const end = e => { if (e.pointerId === id) { id = null; stage.classList.remove("dragging"); } };
  stage.addEventListener("pointerup", end);
  stage.addEventListener("pointercancel", end);
}

/* ── wiring ──────────────────────────────────────────────────────────────── */
function show(idx) {
  state.i = Math.max(0, Math.min(state.plans.length - 1, idx));
  const p = state.plans[state.i], doc = p.doc;
  $("#planName").textContent = p.key;
  $("#planSub").textContent =
    doc.image_width_px + "×" + doc.image_height_px + "px · " +
    doc.rooms.length + " rooms · " + doc.walls.length + " walls · " +
    doc.openings.length + " openings · schema " + doc.schema_version;
  const img = $("#planImg");
  img.src = p.imgUrl;
  img.alt = p.key;
  img.width = doc.image_width_px;
  img.height = doc.image_height_px;
  renderPlanList(); renderOverlay(); renderData();
  if (img.complete) fit(); else img.onload = fit;
}

$("#layers").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const k = b.getAttribute("data-layer");
  state.layers[k] = !state.layers[k];
  b.setAttribute("aria-pressed", String(state.layers[k]));
  renderOverlay();
});
$("#fit").onclick = fit;
addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  if (e.key === "ArrowRight") show(state.i + 1);
  else if (e.key === "ArrowLeft") show(state.i - 1);
  else if (e.key.toLowerCase() === "f") fit();
});
addEventListener("resize", () => { if (state.plans.length) fit(); });

function boot(plans) {
  if (!plans.length) { $("#gate").hidden = false; return; }
  plans.sort((a, b) => planNo(a) - planNo(b));
  state.plans = plans;
  $("#gate").hidden = true;
  bindStage();
  show(0);
}

$("#pick").addEventListener("change", async e => boot(await loadFromFiles(e.target.files)));

loadFromServer().then(boot).catch(() => { $("#gate").hidden = false; });

})();
</script>
</body>
</html>
