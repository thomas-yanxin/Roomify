name: Python package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --extra dev
      - name: Verify dependency graph
        run: uv pip check --python .venv/bin/python
      - name: Test
        run: uv run --locked python -m pytest -q
      - name: Lint
        run: uv run --locked python -m ruff check src tests
      - name: Type-check
        run: uv run --locked python -m mypy src

  pip-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install editable package through pip
        run: python -m pip install -e .
      - name: Verify dependency graph
        run: python -m pip check
      - name: Smoke-test import and CLI
        run: |
          python -c "import roomify; print(roomify.__version__)"
          roomify --help
